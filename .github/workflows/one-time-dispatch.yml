name: Déclencher ponctuellement le déploiement

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write

jobs:
  dispatch:
    if: github.event.issue.title == 'Déployer dieppeoratoriens.com'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le workflow principal sur main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -f ref=main

      - name: Retrouver le déploiement déclenché
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in {1..12}; do
            RUN_ID="$(gh run list \
              --workflow deploy-pages.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "Impossible de retrouver le run déclenché." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Suivre le déploiement jusqu'à son terme
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: gh run watch "$RUN_ID" --exit-status || true

      - name: Tester GitHub Pages et le DNS public
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set +e
          {
            echo "### Déploiement GitHub Actions"
            gh run view "$RUN_ID" --json status,conclusion,url,headSha --jq '"- statut: \(.status)\n- conclusion: \(.conclusion // \"en cours\")\n- run: \(.url)\n- commit: \(.headSha)"'
            echo
            echo "### GitHub Pages"
            curl -sSIL --max-time 15 -o /tmp/pages.headers -w 'HTTP %{http_code}\n' \
              https://stephanelard-cmd.github.io/www.dieppeoratoriens.com/ || true
            sed -n '1,12p' /tmp/pages.headers 2>/dev/null || true
            echo
            echo "### DNS dieppeoratoriens.com"
            getent ahostsv4 dieppeoratoriens.com || true
            echo
            echo "### DNS www.dieppeoratoriens.com"
            getent ahostsv4 www.dieppeoratoriens.com || true
            echo
            echo "### Site public"
            curl -sSIL --max-time 15 -o /tmp/domain.headers -w 'HTTP %{http_code}\n' \
              https://dieppeoratoriens.com/ || true
            sed -n '1,12p' /tmp/domain.headers 2>/dev/null || true
          } > /tmp/diagnostic.txt 2>&1
          cat /tmp/diagnostic.txt

      - name: Publier le diagnostic et fermer la demande
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "Diagnostic automatique du déploiement :"
            echo
            echo '```text'
            if [ -f /tmp/diagnostic.txt ]; then
              cat /tmp/diagnostic.txt
            else
              echo "Le diagnostic n’a pas pu être produit. Consulter l’exécution GitHub Actions correspondante."
            fi
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment.md
          gh issue close "$ISSUE_NUMBER" --reason completed
