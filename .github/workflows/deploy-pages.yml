name: Déployer dieppeoratoriens.com et synchroniser les calendriers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toutes les 15 minutes, décalé du début d’heure pour limiter les retards de file.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dieppeoratoriens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstituer et vérifier le site
        run: |
          cat package/site.zip.part.* > site.zip
          echo "30efa0522e4239dc6346f46239c26175e75c179c56865d715260b692a1d90ccd  site.zip" | sha256sum -c -
          unzip -tq site.zip
          mkdir -p source
          unzip -q site.zip -d source

      - name: Installer les dépendances de construction
        run: python -m pip install --disable-pip-version-check pillow beautifulsoup4

      - name: Importer l’agenda officiel de Dieppe-Normandie
        run: |
          mkdir -p .cache
          python .github/scripts/sync_official_events.py \
            --output .cache/dieppe-events.json \
            --bootstrap-url https://dieppeoratoriens.com/assets/data/dieppe-events.json \
            --max-pages 10 \
            --max-events 96 \
            --workers 6 \
            --detail-max-age 43200 \
            --max-refresh 18

      - name: Générer le guide local et l’agenda
        run: python .github/scripts/local_guide.py source

      - name: Tester le calendrier et les scripts
        run: |
          python -m unittest discover -s source/tests -p "test_*.py"
          python -m py_compile \
            source/scripts/build_calendar.py \
            source/scripts/fetch_photos.py \
            .github/scripts/seo_optimize.py \
            .github/scripts/perf_optimize.py \
            .github/scripts/home_redirect.py \
            .github/scripts/local_guide.py \
            .github/scripts/fix_office_alignment.py \
            .github/scripts/sync_official_events.py \
            .github/scripts/render_official_events.py \
            .github/scripts/generate_multilingual_site.py

      - name: Construire le site statique
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='README.md' \
            source/ _site/
          cp googlefec5e1e106c9c180.html _site/googlefec5e1e106c9c180.html
          test -f _site/index.html
          test -f _site/disponibilites.html
          test -f _site/avis-localisation.html
          test -f _site/classement-equipements.html
          test -f _site/decouvrir-dieppe.html
          test -f _site/agenda-dieppe.html
          test -f _site/googlefec5e1e106c9c180.html
          grep -q "google-site-verification: googlefec5e1e106c9c180.html" _site/googlefec5e1e106c9c180.html
          test "$(tr -d '\r\n' < _site/CNAME)" = "dieppeoratoriens.com"
          grep -q "31 octobre 2024" _site/classement-equipements.html
          grep -q "153 / 160" _site/classement-equipements.html
          grep -q "79 points" _site/classement-equipements.html
          grep -q "jusqu’à cinq voyageurs" _site/index.html
          grep -q "Office de Tourisme Dieppe-Normandie" _site/decouvrir-dieppe.html
          grep -q "Les Ursulines" _site/decouvrir-dieppe.html

      - name: Synchroniser Booking.com et Airbnb
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          OUTPUT: _site/assets/data/availability.json
        run: |
          if [ -z "$AIRBNB_ICAL_URL" ] && [ -z "$BOOKING_ICAL_URL" ]; then
            echo "Les deux secrets iCal ne sont pas encore configurés : le site indiquera que les dates doivent être vérifiées sur les plateformes."
          elif [ -z "$AIRBNB_ICAL_URL" ] || [ -z "$BOOKING_ICAL_URL" ]; then
            echo "Configuration incomplète : les deux secrets iCal sont obligatoires." >&2
            exit 1
          else
            python source/scripts/build_calendar.py
          fi

      - name: Optimiser les photographies
        env:
          SITE_ROOT: ${{ github.workspace }}/_site
        run: python source/scripts/fetch_photos.py

      - name: Optimiser SEO, Core Web Vitals et accessibilité
        run: |
          python .github/scripts/seo_optimize.py
          python .github/scripts/perf_optimize.py
          python .github/scripts/home_redirect.py
          python .github/scripts/local_guide.py _site --finalize
          python .github/scripts/fix_office_alignment.py _site
          python .github/scripts/render_official_events.py \
            --site-root _site \
            --input .cache/dieppe-events.json
          grep -q "Location appartement Dieppe port" _site/index.html
          grep -q '"LodgingBusiness"' _site/index.html
          grep -q 'hreflang="en-GB"' _site/index.html
          grep -q 'hreflang="de-DE"' _site/index.html
          grep -q 'hreflang="es-ES"' _site/index.html
          grep -q 'noindex,follow' _site/404.html
          grep -q 'gridcell' _site/assets/js/calendar.js
          grep -q 'calendarI18n' _site/assets/js/calendar.js
          ! grep -q 'loadPhotos' _site/assets/js/site.js
          grep -q 'hero-480.webp' _site/index.html
          grep -q 'location.pathname==="/index.html"' _site/index.html
          ! grep -q '/assets/css/site.css' _site/index.html
          ! grep -q '/assets/js/site.js' _site/index.html
          grep -q "decouvrir-dieppe.html" _site/sitemap.xml
          grep -q "agenda-dieppe.html" _site/sitemap.xml
          grep -q '"TouristInformationCenter"' _site/decouvrir-dieppe.html
          grep -q '"Event"' _site/agenda-dieppe.html
          grep -q 'local-guide-home' _site/index.html
          grep -q 'local-guide-v1' _site/assets/css/site.css
          grep -q 'office-tourism-centering-v2' _site/assets/css/site.css
          grep -q '#office-tourisme .office-card' _site/assets/css/site.css
          grep -q '#office-tourisme .contact-list p' _site/assets/css/site.css
          grep -q 'Import automatique de l.agenda officiel' _site/agenda-dieppe.html
          grep -q 'data-official-event="true"' _site/agenda-dieppe.html
          test -f _site/assets/data/dieppe-events.json
          test -f _site/en/index.html
          test -f _site/de/index.html
          test -f _site/es/index.html
          test -f _site/en/disponibilites.html
          test -f _site/de/agenda-dieppe.html
          test -f _site/es/decouvrir-dieppe.html
          grep -q 'language-switcher-v1' _site/index.html
          grep -q '🇬🇧' _site/index.html
          grep -q '🇩🇪' _site/index.html
          grep -q '🇪🇸' _site/index.html
          grep -q 'Ferienwohnung' _site/de/index.html
          grep -q 'Apartamento vacacional' _site/es/index.html
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ET.parse('_site/sitemap.xml')
          payload = json.loads(Path('_site/assets/data/dieppe-events.json').read_text(encoding='utf-8'))
          html = Path('_site/agenda-dieppe.html').read_text(encoding='utf-8')
          events = payload.get('events', [])
          cards = html.count('data-official-event="true"')
          assert payload.get('refresh_interval_minutes') == 15, payload
          assert len(events) >= 5, len(events)
          assert cards == len(events), (cards, len(events))
          assert all(item.get('url', '').startswith('https://www.dieppetourisme.com/agenda/') for item in events)
          for lang in ('en', 'de', 'es'):
              page = Path(f'_site/{lang}/agenda-dieppe.html').read_text(encoding='utf-8')
              assert page.count('data-official-event="true"') == len(events), lang
          print(f'Agenda officiel validé : {len(events)} événements, {cards} cartes HTML par langue.')
          print('Site multilingue et sitemap.xml valides')
          PY

      - name: Vérifier la confidentialité des flux iCal
        run: |
          ! grep -R --line-number --fixed-strings 'ical.booking.com' _site
          ! grep -R --line-number --fixed-strings 'calendar/ical/' _site

      - name: Configurer GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléverser le site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
