name: Diagnostic SEO index.html

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Lighthouse SEO sur index.html
        run: |
          set -euo pipefail
          npx --yes lighthouse https://dieppeoratoriens.com/index.html \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=seo \
            --output=json \
            --output-path=/tmp/seo-index.json
          node <<'NODE'
          const r=require('/tmp/seo-index.json');
          console.log('SEO_INDEX='+Math.round(r.categories.seo.score*100));
          console.log('FINAL_URL='+r.finalUrl);
          for (const ref of r.categories.seo.auditRefs) {
            const a=r.audits[ref.id];
            console.log(`SEO_AUDIT ${ref.id} score=${a.score} mode=${a.scoreDisplayMode} title=${a.title}`);
            if (a.score !== null && a.score < 1) {
              console.log(`FAIL ${ref.id}: ${a.title}`);
              if (a.displayValue) console.log(`DISPLAY ${a.displayValue}`);
              if (a.explanation) console.log(`EXPLANATION ${a.explanation}`);
              if (a.details && a.details.items) console.log('DETAILS '+JSON.stringify(a.details.items).slice(0,4000));
            }
          }
          NODE
